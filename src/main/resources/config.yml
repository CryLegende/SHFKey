# ======================================================================== #
# SHFKey
#
# Plugin : la touche F (échange main principale / secondaire) lance des commandes selon la permission, le monde
# et la région WorldGuard du joueur. La première action dont les conditions sont remplies s'exécute, l'échange
# vanilla est annulé. Un administrateur peut désactiver SHFKey pour un joueur. Avec SHNetwork, cette liste suit
# les joueurs d'un serveur à l'autre (voir la section 'reseau' en bas du fichier).
#
# Actions (section 'actions', dans l'ordre) :
#   permission   Permission requise, ou 'none'.
#   world        Mondes concernés (liste), ou 'none'.
#   region       Région WorldGuard où le joueur doit se trouver, ou 'none'.
#   asOP         true : la commande est lancée par la console et demande un joueur opérateur ; false : par le joueur.
#   commands     Commandes lancées (sans /), %player% = pseudo du joueur.
#
# Sur un réseau de serveurs, les actions ne lancent que des commandes : 'is go' est interceptée par le pont
# SuperiorSkyblock2 (SHSkyBridge), qui envoie le joueur sur le serveur de son île ; 'spawn' ramène au serveur
# qui héberge le spawn. Rien de plus à régler ici, chaque serveur garde la même liste d'actions.
#
# Commandes :
#   /shfkey toggle <joueur>   Active ou désactive SHFKey pour un joueur (même connecté à un autre serveur).
#   /shfkey list              Joueurs pour qui SHFKey est désactivé (la base partagée avec SHNetwork, sinon data.yml).
#   /shfkey reload            Relit config.yml (actions) et messages.yml. Si un fichier est invalide, l'ancienne configuration
#                             reste active. data.yml, la base et la liste des joueurs désactivés ne sont pas touchés ;
#                             la section 'reseau' n'est lue qu'au démarrage.
#   /shfkey import            Mode réseau : reprend data.yml dans la base partagée (une seule fois).
#   Sans argument, la commande affiche les sous-commandes que l'expéditeur a le droit d'utiliser. Elle marche depuis la console.
#
# Permissions :
#   shfkey.admin              Toutes les commandes ci-dessus (op par défaut).
#   shfkey.admin.toggle       /shfkey toggle (op par défaut).
#   shfkey.admin.list         /shfkey list (op par défaut).
#   shfkey.admin.reload       /shfkey reload (op par défaut).
#   shfkey.admin.import       /shfkey import (op par défaut).
#
# Placeholder : %shfkey_is_enabled% = true / false.
#
# Les messages sont dans 'messages.yml'.
#
# ======================================================================== #

actions:
  staff:
    permission: "shstaffrtp.use"
    world: ["none"]
    region: "none"
    commands:
      - "staffrtp"
  playerToSpawn:
    permission: "none"
    world: ["SuperiorWorld"]
    region: "none"
    commands:
      - "spawn"
  1vs1:
    permission: "none"
    world: ["spawn"]
    region: "1vs1"
    commands: []
  playerToIsland:
    permission: "none"
    world: ["spawn"]
    region: "none"
    commands:
      - "is go"
  playerToSpawnFromArena:
    permission: "none"
    world: ["arene"]
    region: "none"
    commands:
      - "spawn"
  playerToSpawnFromChristmas:
    permission: "none"
    world: ["Christmas"]
    region: "none"
    commands:
      - "spawn"

# Nombre maximal de joueurs affichés par /shfkey list.
list-max: 50

# Mode réseau. Actif seulement si SHNetwork est installé et 'actif' vaut true : les joueurs pour qui SHFKey est
# désactivé sont alors dans la base partagée (table shfkey_disabled : une ligne par joueur) et relus à l'arrivée du
# joueur sur un serveur. Sans SHNetwork, rien de ceci n'est utilisé et la liste reste dans data.yml.
# Demande un redémarrage.
reseau:
  actif: true
  # Durée maximale, en secondes, pendant laquelle on attend que l'autre serveur ait fini de sauvegarder
  # le joueur avant de relire son état
  attente-max-secondes: 10
  base-de-donnees:
    url: "jdbc:mariadb://127.0.0.1:3306/bo_net"
    utilisateur: shfkey
    mot-de-passe: CHANGE_ME
    # Délai maximal de connexion et de réponse de la base, en millisecondes. Une base qui ne répond pas
    # laisse le joueur avec SHFKey actif.
    delai-ms: 3000
