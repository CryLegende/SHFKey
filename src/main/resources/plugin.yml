name: SHFKey
version: '${project.version}'
main: org.Cry_Legende.sHFKey.SHFKey
api-version: '1.20'
author: Cry_Legende
softdepend: [WorldGuard, PlaceholderAPI, SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (liste en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shfkey:
    description: Administration de SHFKey (toggle, import, reload, list).
    usage: /shfkey <toggle|import|reload|list>
    permission: shfkey.admin.toggle;shfkey.admin.import;shfkey.admin.reload;shfkey.admin.list

permissions:
  shfkey.admin:
    description: Toutes les commandes d'administration de SHFKey.
    default: op
    children:
      shfkey.admin.toggle: true
      shfkey.admin.import: true
      shfkey.admin.reload: true
      shfkey.admin.list: true
  shfkey.admin.toggle:
    description: /shfkey toggle <joueur>
    default: op
  shfkey.admin.import:
    description: /shfkey import (avec SHNetwork)
    default: op
  shfkey.admin.reload:
    description: /shfkey reload
    default: op
  shfkey.admin.list:
    description: /shfkey list
    default: op
