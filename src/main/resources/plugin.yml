name: SHFKey
version: '${project.version}'
main: org.Cry_Legende.sHFKey.SHFKey
api-version: '1.20'
author: Cry_Legende
softdepend: [WorldGuard, PlaceholderAPI, SHNetwork]
# Chargées par Paper dans le classloader du plugin : le serveur n'embarque que les pilotes MySQL et SQLite.
# Seul le mode réseau (liste en MariaDB) s'en sert.
libraries:
  - com.zaxxer:HikariCP:5.1.0
  - org.mariadb.jdbc:mariadb-java-client:3.4.1

commands:
  shfkey:
    description: Commande principale pour gérer SHFKey
    usage: /shfkey toggle <player> | import
    permission: shfkey.admin
